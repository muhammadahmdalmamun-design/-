<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4F1;--c:#fff;--t:#16241f;--m:#5f736b;--p:#0F6B5C;--b:#d5e2dc;--g:#E3B04B}
@media(prefers-color-scheme:dark){:root{--bg:#0e1714;--c:#16231f;--t:#e5efea;--m:#8fa69c;--p:#2bb39b;--b:#26372f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:'Noto Sans Bengali',system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
header{background:linear-gradient(135deg,#0B4A3F,#0F6B5C);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 11px;font:inherit;font-weight:600}
main{flex:1;overflow:auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom));max-width:760px;width:100%;margin:auto}
main.tv{padding:0;max-width:none;overflow:hidden;display:flex;flex-direction:column}
iframe{flex:1;width:100%;border:0;background:#fff}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(10,50,40,.07)}
.m{color:var(--m);font-size:13px}
h2{margin:2px 0 4px;font-size:18px}p{margin:4px 0 8px}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--p);color:#fff;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--t);border:1px solid var(--b)}
.big{width:100%;padding:14px;font-size:17px}
.nx{border:2px solid var(--p)}
.it{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--b);cursor:pointer}
.it:last-child{border:0}.f{flex:1;min-width:0}
.no{width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--p);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.cb{width:36px;height:36px;padding:0;border-radius:50%;background:transparent;color:var(--m);border:2px solid var(--b);font-size:16px}
.cb.on{background:var(--p);color:#fff;border-color:var(--p)}
.pb{height:8px;background:var(--bg);border-radius:8px;margin:6px 0}.pb i{display:block;height:8px;background:var(--p);border-radius:8px}
input,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);margin:4px 0 8px}
textarea{min-height:90px}
label{font-size:14px;font-weight:600}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.ch button{background:transparent;color:var(--t);border:1px solid var(--b);font-weight:400;padding:7px 11px}.ch button.on{background:var(--p);color:#fff;border-color:var(--p)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.hint{background:rgba(15,107,92,.1);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}

/* ===== v3: ঝিলমিল RGB ===== */
@keyframes rg{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
body{background:linear-gradient(120deg,#ff1744,#ff9100,#ffea00,#00e676,#00b0ff,#3d5afe,#d500f9,#ff1744) 0 0/300% 100%;animation:rg 24s linear infinite;background-attachment:fixed}
#sp{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(2px 2px at 12% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 38% 70%,#fff,transparent),radial-gradient(2px 2px at 63% 35%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 80%,#fff,transparent),radial-gradient(2px 2px at 25% 90%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 12%,#fff,transparent);animation:tw 2.4s ease-in-out infinite}
#sp.b{background-size:210px 210px;animation-delay:1.2s;opacity:.6}
header,main{position:relative;z-index:1}
.card{background:rgba(255,255,255,.9);backdrop-filter:blur(6px)}
@media(prefers-color-scheme:dark){.card{background:rgba(14,23,20,.86)}}
@media(prefers-reduced-motion:reduce){body,#sp{animation:none}}

/* ===== v9: উসওয়াতুন হাসানার ঝিলমিলি ব্যাকগ্রাউন্ড (ডিফল্ট), 🎨 বোতামে আগের রঙিন ব্যাকগ্রাউন্ডে ফেরা যায় ===== */
:root{--nb:#f4f1e8;--cv:rgba(255,255,255,.26);--iv:rgba(255,255,255,.55)}
@media(prefers-color-scheme:dark){:root{--nb:#0d1813;--cv:rgba(14,23,20,.30);--iv:rgba(22,35,31,.55)}}
.jc{position:fixed;left:0;top:0;pointer-events:none;z-index:-1}
html.bgold .jc{display:none}
html:not(.bgold) body{background:var(--nb)!important;animation:none!important}
html:not(.bgold) #sp{display:none}
html:not(.bgold) .card{background:var(--cv)!important;border-color:rgba(120,150,135,.25)!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html:not(.bgold) main.tv>div:first-child,html:not(.bgold) main.tv>div:nth-child(2){background:var(--cv)!important}
html:not(.bgold) input,html:not(.bgold) textarea,html:not(.bgold) select{background:var(--iv)!important}
html:not(.bgold) main :is(.card,.it,.hint,h2,p,label,b){text-shadow:0 0 8px var(--nb),0 0 3px var(--nb)}
html:not(.bgold) iframe{background:transparent!important}

/* ===== নতুন কাঠামো: নিচের ট্যাব, ড্যাশবোর্ড ===== */
main{padding-bottom:16px}
#nv{display:flex;background:var(--c);border-top:1px solid var(--b);padding:4px 4px calc(4px + env(safe-area-inset-bottom));position:relative;z-index:2}
#nv a{flex:1;text-align:center;padding:5px 2px;font-size:11px;color:var(--m);text-decoration:none;font-weight:600}
#nv a b{display:block;font-size:20px;line-height:1.3}#nv a.on{color:var(--p)}
.pg{padding:0 12px 12px;max-width:760px;margin:auto}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.sx{background:var(--bg);border-radius:12px;padding:10px;text-align:center}.sx b{display:block;font-size:22px;color:var(--p)}
</style></head><body>
